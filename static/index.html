<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI CAD</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --line: #e1e4e8; --text: #1d2125; --muted: #6b7280;
    --accent: #2563eb; --accent-text: #fff; --user: #eef2ff; --bot: #f3f4f6; --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111316; --panel: #1a1d21; --line: #2c3036; --text: #e6e8eb; --muted: #9aa1ab;
      --accent: #3b82f6; --user: #1e2a44; --bot: #23272d; --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  .app { display: grid; grid-template-columns: 340px 1fr 300px; height: 100vh; }
  aside, .right { background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  aside { border-right: 1px solid var(--line); }
  .right { border-left: 1px solid var(--line); overflow-y: auto; padding: 16px; gap: 16px; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 16px; }
  header .sub { color: var(--muted); font-size: 12px; }
  #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 8px 11px; border-radius: 10px; white-space: pre-wrap; max-width: 95%; }
  .msg.user { background: var(--user); align-self: flex-end; }
  .msg.bot { background: var(--bot); align-self: flex-start; }
  .msg.err { color: var(--err); }
  .examples { padding: 0 12px 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .examples button { font-size: 12px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); cursor: pointer; }
  form.chat { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; height: 60px; padding: 8px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font: inherit; }
  button.primary { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px;
    padding: 8px 14px; font-weight: 600; cursor: pointer; }
  button.primary:disabled { opacity: .5; cursor: default; }
  main { position: relative; min-width: 0; }
  #viewer { position: absolute; inset: 0; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 3px; }
  input { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
  dl { display: grid; grid-template-columns: auto auto; gap: 4px 12px; margin: 0; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .downloads { display: flex; gap: 8px; }
  .downloads a { flex: 1; text-align: center; padding: 7px; border: 1px solid var(--line); border-radius: 8px;
    color: var(--text); text-decoration: none; font-weight: 600; }
  #history button { display: block; width: 100%; text-align: left; padding: 6px 8px; margin-bottom: 4px;
    border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--text); cursor: pointer; }
  .hidden { display: none !important; }
  .banner { margin: 12px; padding: 8px 10px; border-radius: 8px; background: var(--bot); color: var(--muted); font-size: 12px; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 50vh 45vh auto; height: auto; }
    main { order: -1; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header><h1>AI CAD</h1><div class="sub" id="model">Describe a part and it will be modeled.</div></header>
    <div id="nokey" class="banner hidden">AI chat is off: no <code>ANTHROPIC_API_KEY</code> set. You can still build gears from the parameter panel.</div>
    <div id="log"></div>
    <div class="examples">
      <button>Spur gear, 24 teeth, module 2, 8mm bore with keyway</button>
      <button>Make it 30 teeth with a 20mm hub</button>
      <button>A 60x40x5 mounting plate with four M5 holes</button>
    </div>
    <form class="chat" id="chatForm">
      <textarea id="input" placeholder="e.g. a gear with 40 teeth and 80mm pitch diameter, 12mm thick"></textarea>
      <button class="primary" id="send">Send</button>
    </form>
  </aside>

  <main><div id="viewer"></div><div id="empty">No part yet</div></main>

  <div class="right">
    <section>
      <h2>Gear parameters</h2>
      <form id="gearForm" class="grid">
        <label>Module<input name="module" type="number" step="0.1" value="2"></label>
        <label>Teeth<input name="teeth" type="number" step="1" value="24"></label>
        <label>Pressure °<input name="pressure_angle" type="number" step="0.5" value="20"></label>
        <label>Face width<input name="face_width" type="number" step="0.5" value="10"></label>
        <label>Bore Ø<input name="bore_diameter" type="number" step="0.5" value="8"></label>
        <label>Keyway w<input name="keyway_width" type="number" step="0.5" value="0"></label>
        <label>Keyway d<input name="keyway_depth" type="number" step="0.1" value="0"></label>
        <label>Hub Ø<input name="hub_diameter" type="number" step="0.5" value="0"></label>
        <label>Hub length<input name="hub_length" type="number" step="0.5" value="0"></label>
        <div style="display:flex;align-items:end"><button class="primary" style="width:100%">Rebuild</button></div>
      </form>
    </section>
    <section id="info" class="hidden">
      <h2 id="partName">Part</h2>
      <dl id="dims"></dl>
    </section>
    <section id="dl" class="hidden">
      <h2>Export</h2>
      <div class="downloads"><a id="stepLink" download>STEP</a><a id="stlLink" download>STL</a></div>
    </section>
    <section><h2>History</h2><div id="history"></div></section>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { STLLoader } from "three/addons/loaders/STLLoader.js";

const $ = (id) => document.getElementById(id);
const sessionId = crypto.randomUUID();
const history = [];

// ---------- viewer
const el = $("viewer");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(devicePixelRatio);
el.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 10000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(1, -1.5, 2); scene.add(sun);
const grid = new THREE.GridHelper(200, 20, 0x888888, 0x888888);
grid.rotation.x = Math.PI / 2; grid.material.opacity = 0.2; grid.material.transparent = true; scene.add(grid);
let mesh = null;

function resize() {
  const { clientWidth: w, clientHeight: h } = el;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(el); resize();
(function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();

function showPart(part) {
  new STLLoader().load(part.stl + "?t=" + Date.now(), (geom) => {
    if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); }
    geom.computeVertexNormals();
    mesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({ color: 0x8aa4c8, metalness: 0.35, roughness: 0.45 }));
    scene.add(mesh);
    geom.computeBoundingSphere();
    const { center, radius } = geom.boundingSphere;
    controls.target.copy(center);
    camera.position.set(center.x + radius * 1.6, center.y - radius * 2.2, center.z + radius * 1.8);
    grid.position.z = geom.boundingBox?.min.z ?? 0;
    $("empty").classList.add("hidden");
  });

  $("info").classList.remove("hidden"); $("dl").classList.remove("hidden");
  $("partName").textContent = part.name;
  const rows = { "Valid solid": part.valid_solid ? "yes" : "NO",
                 "Size (mm)": part.bounding_box_mm.join(" × "), "Volume (mm³)": part.volume_mm3.toLocaleString() };
  for (const [k, v] of Object.entries(part.derived || {})) rows[k.replace(/_mm$/, "").replaceAll("_", " ") + " (mm)"] = v;
  $("dims").innerHTML = Object.entries(rows).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  $("stepLink").href = part.step; $("stepLink").download = part.name + ".step";
  $("stlLink").href = part.stl; $("stlLink").download = part.name + ".stl";

  if (part.params) for (const [k, v] of Object.entries(part.params)) {
    const input = $("gearForm").elements[k]; if (input) input.value = v;
  }
}

function addHistory(part) {
  history.push(part);
  const b = document.createElement("button");
  b.textContent = `${history.length}. ${part.name}`;
  b.onclick = () => showPart(part);
  $("history").prepend(b);
}

// ---------- chat
function say(text, cls) {
  const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
  $("log").appendChild(d); $("log").scrollTop = 1e9; return d;
}

async function send(text) {
  if (!text.trim()) return;
  say(text, "user"); $("input").value = ""; $("send").disabled = true;
  const pending = say("Modeling…", "bot");
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    pending.textContent = data.reply || "Done.";
    for (const p of data.parts) addHistory(p);
    if (data.parts.length) showPart(data.parts.at(-1));
  } catch (e) { pending.textContent = e.message; pending.classList.add("err"); }
  $("send").disabled = false;
}

$("chatForm").onsubmit = (e) => { e.preventDefault(); send($("input").value); };
$("input").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("input").value); } };
document.querySelectorAll(".examples button").forEach((b) => b.onclick = () => send(b.textContent));

// ---------- direct parameter editing (works without AI)
$("gearForm").onsubmit = async (e) => {
  e.preventDefault();
  const body = Object.fromEntries([...new FormData(e.target)].map(([k, v]) => [k, Number(v)]));
  body.name = `Gear z${body.teeth} m${body.module}`;
  const r = await fetch("/api/gear", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) return say(data.detail, "bot err");
  addHistory(data); showPart(data);
};

fetch("/api/status").then((r) => r.json()).then((s) => {
  $("model").textContent = s.ai_enabled ? `AI: ${s.model}` : "AI chat disabled";
  if (!s.ai_enabled) $("nokey").classList.remove("hidden");
  $("gearForm").requestSubmit();
});
</script>
</body>
</html>
